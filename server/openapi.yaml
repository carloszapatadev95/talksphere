          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushTokensResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/push/test:
    post:
      summary: Enviar push de prueba (debug)
      description: |
        Envía una notificación push de prueba al usuario especificado
        (o al propio usuario autenticado si no se especifica).
        Solo uso en depuración.
      tags: [Debug]
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushTestRequest'
      responses:
        '200':
          description: Resultado del envío de prueba
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushTestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

x-webhooks:
  # CLIENTE -> SERVIDOR
  send_message:
    summary: Enviar mensaje de texto
    description: |
      Persiste el mensaje en DB y lo reenvía al receptor(s).
      Para chat 1-a-1: requiere receiverId.
      Para grupo: requiere groupId.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SendMessageRequest'

  typing:
    summary: Indicar escritura
    description: Notifica al receptor que el usuario está escribiendo.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              receiverId:
                type: integer
              groupId:
                type: integer
              isTyping:
                type: boolean
                example: true

  mark_read:
    summary: Marcar mensajes como leídos
    description: Marca como leídos todos los mensajes no leídos del senderId hacia el usuario actual.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [senderId]
            properties:
              senderId:
                type: integer

  call_user:
    summary: Iniciar llamada WebRTC
    description: Envía oferta SDP al usuario destino para iniciar llamada de voz o video.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [targetId, offer, callType]
            properties:
              targetId:
                type: integer
              offer:
                type: object
                description: Oferta SDP
              callType:
                type: string
                enum: [voice, video]

  answer_call:
    summary: Responder llamada
    description: Envía respuesta SDP al caller aceptando la llamada.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [targetId, answer]
            properties:
              targetId:
                type: integer
              answer:
                type: object
                description: Respuesta SDP

  ice_candidate:
    summary: Intercambiar ICE candidate
    description: Releva candidates ICE entre peers para establecer conexión P2P.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [targetId, candidate]
            properties:
              targetId:
                type: integer
              candidate:
                type: object
                description: ICE candidate

  end_call:
    summary: Finalizar llamada
    description: Notifica al otro peer que la llamada terminó.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [targetId]
            properties:
              targetId:
                type: integer

  toggle_audio:
    summary: Silenciar o activar micrófono
    description: Notifica al peer sobre el estado del audio local.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [targetId, enabled]
            properties:
              targetId:
                type: integer
              enabled:
                type: boolean

  toggle_video:
    summary: Activar o desactivar cámara
    description: Notifica al peer sobre el estado del video local.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [targetId, enabled]
            properties:
              targetId:
                type: integer
              enabled:
                type: boolean

  # SERVIDOR -> CLIENTE
  incoming_call:
    summary: Notificación de llamada entrante
    description: El servidor notifica al destino que alguien lo está llamando.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              callerId:
                type: integer
              callerUsername:
                type: string
              offer:
                type: object
              callType:
                type: string
                enum: [voice, video]

  call_answered:
    summary: Llamada aceptada
    description: El servidor notifica al caller que el destino aceptó la llamada.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              answererId:
                type: integer
              answer:
                type: object

  call_ended:
    summary: Llamada finalizada
    description: El servidor notifica a ambos peers que la llamada terminó.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              endedBy:
                type: integer

  new_message:
    summary: Nuevo mensaje recibido
    description: Mensaje de chat en tiempo real (1-a-1 o grupo).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'

  typing_indicator:
    summary: Indicador de escritura
    description: Notifica que un contacto está escribiendo.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              userId:
                type: integer
              groupId:
                type: integer
              isTyping:
                type: boolean

  messages_read:
    summary: Confirmación de lectura (1-a-1)
    description: Notifica al remitente que sus mensajes fueron leídos en un chat 1-a-1.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              readBy:
                type: integer

  group_messages_read:
    summary: Confirmación de lectura en grupo
    description: Notifica a los miembros del grupo que alguien marcó los mensajes como leídos.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              groupId:
                type: integer
              readBy:
                type: integer

  audio_toggled:
    summary: Peer silenció o activó micrófono
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              userId:
                type: integer
              enabled:
                type: boolean

  video_toggled:
    summary: Peer activó o desactivó cámara
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              userId:
                type: integer
              enabled:
                type: boolean

  user_status:
    summary: Cambio de estado online/offline
    description: Se emite a todos los clientes cuando un usuario se conecta o desconecta.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              userId:
                type: integer
              is_online:
                type: boolean

  # ──────────────────────────────────────────────
  # LLAMADAS GRUPALES (LiveKit SFU)
  # ──────────────────────────────────────────────
  group_call_started:
    summary: Llamada grupal iniciada
    description: >
      Un miembro del grupo inició una llamada grupal.
      El servidor reenvía este evento a todos los miembros del grupo
      (excepto al iniciador) con los datos de la sala LiveKit.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              groupId:
                type: integer
              groupName:
                type: string
                description: Nombre del grupo para mostrar en el modal entrante
              roomName:
                type: string
              callType:
                type: string
                enum: [voice, video]
              startedBy:
                type: integer
              startedByName:
                type: string

  group_call_ended:
    summary: Llamada grupal finalizada
    description: Se emite a todos los clientes cuando una llamada grupal termina.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              groupId:
                type: integer

  group_call_declined:
    summary: Llamada grupal rechazada
    description: Se emite cuando un miembro rechaza unirse a una llamada grupal.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              groupId:
                type: integer
              userId:
                type: integer
                description: ID del usuario que rechazó
